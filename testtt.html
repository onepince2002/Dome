<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行車生物力學分析器 (F-V / P-V 曲線)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { font-size: 24px; color: #2c3e50; margin-top: 0; }
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select, input[type="file"], button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        #chartContainer { position: relative; height: 50vh; width: 100%; }
        .stats { display: flex; gap: 20px; margin-top: 15px; font-weight: bold; color: #e74c3c; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚴‍♂️ 踩踏力學分析器 (TCX 支援)</h1>
    <div class="controls">
        <input type="file" id="fileInput" accept=".tcx">
        <select id="crankLength">
            <option value="160">曲柄長度: 160 mm</option>
            <option value="162.5" selected>曲柄長度: 162.5 mm</option>
            <option value="165">曲柄長度: 165 mm</option>
            <option value="170">曲柄長度: 170 mm</option>
        </select>
        <button onclick="processData()">分析訓練資料</button>
    </div>
    <div class="stats" id="statsOutput"></div>
</div>

<div class="card">
    <div id="chartContainer">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let rawData = [];
    let myChart = null;

    // 讀取檔案
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            parseTCX(e.target.result);
        };
        reader.readAsText(file);
    });

    // 解析 TCX 檔案 (提取迴轉速與功率)
    function parseTCX(xmlString) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        const trackpoints = xmlDoc.getElementsByTagName("Trackpoint");
        
        rawData = [];
        for (let i = 0; i < trackpoints.length; i++) {
            const tp = trackpoints[i];
            
            // 嘗試取得 Cadence
            const cadenceNode = tp.getElementsByTagName("Cadence")[0];
            let cadence = cadenceNode ? parseFloat(cadenceNode.textContent) : 0;

            // 嘗試取得 Watts (通常在 Extensions 裡面)
            let watts = 0;
            const extensions = tp.getElementsByTagName("Extensions")[0];
            if (extensions) {
                const wattsNode = extensions.getElementsByTagNameNS("*", "Watts")[0];
                if (wattsNode) watts = parseFloat(wattsNode.textContent);
            }

            if (cadence > 0 && watts > 0) {
                rawData.push({ cadence: cadence, power: watts });
            }
        }
        alert(`成功讀取了 ${rawData.length} 筆有效踩踏數據！請點擊「分析訓練資料」。`);
    }

    // 主處理邏輯
    function processData() {
        if (rawData.length === 0) {
            alert("請先上傳包含功率與迴轉速的 TCX 檔案！");
            return;
        }

        const crankL = parseFloat(document.getElementById('crankLength').value) / 1000; // 轉成公尺
        
        // 1. 簡易延遲校正 (將功率陣列往前移 1 秒)
        let alignedData = [];
        for (let i = 0; i < rawData.length - 1; i++) {
            alignedData.push({
                cadence: rawData[i].cadence,
                power: rawData[i+1].power // 功率前移校正
            });
        }

        // 2. 篩選高輸出區間 (只取功率大於 150W 的資料來做線性擬合，過濾掉滑行)
        let effortData = alignedData.filter(d => d.power > 150 && d.cadence > 40);
        
        // 計算切線力量 (Force = Power / (Cadence * 2pi/60 * L))
        effortData.forEach(d => {
            const omega = d.cadence * (2 * Math.PI / 60);
            d.force = d.power / (omega * crankL);
        });

        // 3. 最小平方法 (Linear Regression) 計算 F-V 直線 (Force = slope * Cadence + intercept)
        let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
        const n = effortData.length;
        effortData.forEach(d => {
            sumX += d.cadence;
            sumY += d.force;
            sumXY += (d.cadence * d.force);
            sumX2 += (d.cadence * d.cadence);
        });
        
        const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
        const intercept = (sumY - slope * sumX) / n;

        // 4. 準備畫圖資料 (從 40 rpm 到 140 rpm)
        let chartLabels = [];
        let forceLine = [];
        let powerCurve = [];
        let maxPower = 0;
        let optimalCadence = 0;

        for (let cad = 40; cad <= 140; cad++) {
            chartLabels.push(cad);
            
            // F-V 預估力量
            let f = slope * cad + intercept;
            if (f < 0) f = 0;
            forceLine.push(f);
            
            // P-V 預估功率 (Power = Force * omega * L)
            let omega = cad * (2 * Math.PI / 60);
            let p = f * omega * crankL;
            powerCurve.push(p);

            // 記錄理論最佳轉速
            if (p > maxPower) {
                maxPower = p;
                optimalCadence = cad;
            }
        }

        document.getElementById('statsOutput').innerText = 
            `💡 數據分析結果：理論最大功率峰值約 ${Math.round(maxPower)}W，落於 ${optimalCadence} rpm (此為最佳發力甜蜜點)`;

        drawChart(chartLabels, forceLine, powerCurve);
    }

    // 使用 Chart.js 畫圖
    function drawChart(labels, forceData, powerData) {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        if (myChart) {
            myChart.destroy(); // 清除舊圖
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '力量 F-V (牛頓 N)',
                        data: forceData,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        yAxisID: 'y',
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: '功率 P-V (瓦特 W)',
                        data: powerData,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderDash: [5, 5],
                        yAxisID: 'y1',
                        fill: true,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        title: { display: true, text: '迴轉速 Cadence (rpm)', font: {size: 14} }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: '切線力量 (N)', font: {size: 14} },
                        min: 0
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: '功率 (W)', font: {size: 14} },
                        grid: { drawOnChartArea: false },
                        min: 0
                    }
                }
            }
        });
    }
</script>

</body>
</html>
